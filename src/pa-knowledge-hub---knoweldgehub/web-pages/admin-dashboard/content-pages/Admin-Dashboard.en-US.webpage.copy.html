<script src="/content.js" defer></script>
<div class="dashboard-shell admin-shell" id="adminHub">
  <a class="admin-skip" href="#adminMain">Skip to content</a>
  <header class="admin-heading">
    <div><span class="admin-kicker">Manager workspace</span><h1>Content editor</h1><p>Create, review and publish Knowledge Hub content.</p></div>
    <div class="admin-actions admin-create-actions"><button class="admin-button" id="adminImport" type="button" hidden>Import existing content</button><label for="adminNewKind">Content type</label><select id="adminNewKind"><option value="learningPath">Learning pathway</option><option value="module">Training module</option><option value="prompt">Prompt</option><option value="testimony">Testimony</option><option value="agent">Agent</option><option value="page">Page content</option></select><button class="admin-button admin-button-primary" id="adminCreate" type="button">Create content</button></div>
  </header>
  <div class="admin-layout">
    <nav class="admin-nav" aria-label="Content types" id="adminNav"></nav>
    <main id="adminMain" class="admin-main" tabindex="-1">
      <div id="adminNotice" class="admin-notice" role="status" aria-live="polite"></div>
      <section id="adminListView" aria-labelledby="adminListTitle">
        <div class="admin-section-head"><div><h2 id="adminListTitle">All content</h2><p>Choose an item to edit, or create something new.</p></div><button class="admin-button admin-button-primary" id="adminCreateInline" type="button">Create new</button></div>
        <div class="admin-filters"><label for="adminSearch">Search content</label><input id="adminSearch" type="search" placeholder="Search by title or description"><label for="adminStatusFilter">Status</label><select id="adminStatusFilter"><option value="all">All statuses</option><option value="draft">Draft</option><option value="published">Published</option><option value="unpublished">Unpublished</option></select></div>
        <div id="adminItems" class="admin-items" aria-live="polite"></div>
      </section>
      <section id="adminEditorView" hidden aria-labelledby="adminEditorTitle">
        <div class="admin-section-head admin-editor-head"><div><button class="admin-link-button" id="adminBack" type="button">← Back to content</button><h2 id="adminEditorTitle">New content</h2><p id="adminEditorStatus"></p></div><div class="admin-actions"><button class="admin-button" id="adminPreview" type="button">Preview</button><button class="admin-button admin-button-primary" id="adminSave" type="button">Save draft</button></div></div>
        <form id="adminForm" novalidate></form>
        <div class="admin-publish-bar"><span id="adminPublishHint">Save a draft before publishing.</span><div class="admin-actions"><button class="admin-button" id="adminDuplicate" type="button" hidden>Duplicate</button><button class="admin-button admin-button-danger" id="adminUnpublish" type="button" hidden>Unpublish</button><button class="admin-button admin-button-primary" id="adminPublish" type="button">Publish</button></div></div>
      </section>
      <section id="adminImagesView" hidden aria-labelledby="adminImagesTitle">
        <div class="admin-section-head"><div><h2 id="adminImagesTitle">Images</h2><p>Upload an image for a testimony or content section.</p></div></div>
        <form id="adminUploadForm" class="admin-upload-form"><label for="adminImageFile">Image file</label><input id="adminImageFile" type="file" accept="image/jpeg,image/png,image/webp" required><label for="adminImageAlt">Image description</label><input id="adminImageAlt" type="text" required maxlength="250" placeholder="Describe the image for people using screen readers"><button class="admin-button admin-button-primary" type="submit">Upload image</button></form>
        <div id="adminImages" class="admin-image-grid"></div>
      </section>
    </main>
  </div>
  <dialog id="adminDialog" class="admin-dialog"><div class="admin-dialog-head"><h2 id="adminDialogTitle">Preview</h2><button id="adminDialogClose" class="admin-button" type="button">Close</button></div><div id="adminDialogBody"></div></dialog>
</div>
